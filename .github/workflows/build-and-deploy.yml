name: Build and Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/${{ github.repository }}/web
  RENDER_IMAGE: ghcr.io/${{ github.repository }}/render

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run Ruby tests
        env:
          RAILS_ENV: test
          POSTGRES_HOST: localhost
        run: bin/rails db:test:prepare test
        # If tests need a real Postgres later, add a `services: postgres:` block.

  test-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/render
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/render/go.sum

      - run: go vet ./...
      - run: go test ./...

  build-web:
    needs: [test-ruby, test-go]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  build-render:
    needs: [test-ruby, test-go]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./services/render
          push: true
          tags: |
            ${{ env.RENDER_IMAGE }}:${{ github.sha }}
            ${{ env.RENDER_IMAGE }}:latest
          cache-from: type=gha,scope=render
          cache-to: type=gha,scope=render,mode=max

  deploy:
    needs: [build-web, build-render]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd /srv/fraktur_ocr
            export IMAGE_TAG
            docker compose -f docker-compose.vps.yml pull
            docker compose -f docker-compose.vps.yml up -d --remove-orphans
            docker compose -f docker-compose.vps.yml exec -T web bin/rails db:migrate
            docker image prune -f
