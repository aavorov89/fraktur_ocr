development:
  adapter: async

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  # 1 s polling is fast enough for Turbo Streams in this app; cuts DB poll
  # load and OTel trace volume 10x vs the default 100 ms.
  polling_interval: 1.second
  message_retention: 1.day