version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: fraktur_ocr_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-fraktur_ocr_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUBY_VERSION: 3.2.2
    image: fraktur_ocr:${IMAGE_TAG:-latest}
    container_name: fraktur_ocr_web
    restart: always
    ports:
      - "${HOST_PORT:-3000}:80"
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_SERVE_STATIC_FILES=true
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - RAILS_HOSTNAME=${RAILS_HOSTNAME:-localhost}
      - RAILS_MAX_THREADS=${RAILS_MAX_THREADS:-5}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fraktur_ocr_production}
      - PDF_ROOT_DIR=/var/lib/fraktur/pdfs
      - RENDER_OUTPUT_DIR=/var/lib/fraktur/crops
      # Puma worker timeout for large file uploads (10 minutes)
      - PUMA_WORKER_TIMEOUT=600
      # Thruster timeout configuration for large file uploads (10 minutes)
      - HTTP_READ_TIMEOUT=600
      - HTTP_WRITE_TIMEOUT=600
      - HTTP_IDLE_TIMEOUT=300
      # Disable Thruster's X-Sendfile so X-Accel-Redirect passes through to nginx
      - X_SENDFILE_ENABLED=0
    volumes:
      - ./storage:/rails/storage
      - ./log:/rails/log
      - pdfs:/var/lib/fraktur/pdfs
      - crops:/var/lib/fraktur/crops
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.docker.compose.project=fraktur_ocr"
    depends_on:
      db:
        condition: service_healthy
      worker:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUBY_VERSION: 3.2.2
    image: fraktur_ocr:${IMAGE_TAG:-latest}
    container_name: fraktur_ocr_worker
    restart: always
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - RAILS_MAX_THREADS=${RAILS_MAX_THREADS:-5}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fraktur_ocr_production}
      - RENDER_OUTPUT_DIR=/var/lib/fraktur/crops
    volumes:
      - ./storage:/rails/storage
      - ./public:/rails/public
      - ./log:/rails/log
      - crops:/var/lib/fraktur/crops
    command: bin/rails solid_queue:start
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f solid_queue || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.docker.compose.project=fraktur_ocr"

  render_listener:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUBY_VERSION: 3.2.2
    image: fraktur_ocr:${IMAGE_TAG:-latest}
    container_name: fraktur_ocr_render_listener
    restart: always
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fraktur_ocr_production}
      - RENDER_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fraktur_ocr_production}
    command: bin/render_listener
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  render:
    build:
      context: ./services/render
    image: fraktur_render:${IMAGE_TAG:-latest}
    container_name: fraktur_ocr_render
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fraktur_ocr_production}
      - PDF_ROOT_DIR=/var/lib/fraktur/pdfs
      - RENDER_OUTPUT_DIR=/var/lib/fraktur/crops
      - CACHE_DIR=/var/lib/fraktur/render-cache
    volumes:
      - pdfs:/var/lib/fraktur/pdfs
      - crops:/var/lib/fraktur/crops
      - render_cache:/var/lib/fraktur/render-cache
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  pdfs:
    driver: local
  crops:
    driver: local
  render_cache:
    driver: local

networks:
  default:
    name: fraktur_ocr_network
    driver: bridge
