version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraktur_ocr:latest
    container_name: fraktur_ocr_web
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_SERVE_STATIC_FILES=true
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      # Optional: Set custom hostname/port
      # - RAILS_HOSTNAME=your-domain.com
      # - PORT=80
    volumes:
      # Persist SQLite databases and Active Storage files
      - ./storage:/rails/storage
      # Persist uploaded files and precompiled assets
      - ./public:/rails/public
      # Persist application logs
      - ./log:/rails/log
      # Optional: persist tmp cache for better performance
      # - ./tmp:/rails/tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - worker

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraktur_ocr:latest
    container_name: fraktur_ocr_worker
    restart: unless-stopped
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
    volumes:
      # Share the same volumes as web for database access
      - ./storage:/rails/storage
      - ./public:/rails/public
      - ./log:/rails/log
    command: bin/rails solid_queue:start
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f solid_queue || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: fraktur_ocr_network
