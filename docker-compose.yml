version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraktur_ocr:latest
    container_name: fraktur_ocr_web
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_SERVE_STATIC_FILES=true
      # IMPORTANT: Set this to your actual master key value
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      # Optional: Set custom hostname/port
      # - RAILS_HOSTNAME=your-domain.com
      # - PORT=80
    volumes:
      # Persist SQLite databases
      - ./storage:/rails/storage
      # Persist uploaded files
      - ./public:/rails/public
      # Optional: persist logs
      - ./log:/rails/log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Uncomment if you need to override default command
    # command: ./bin/thrust ./bin/rails server

networks:
  default:
    name: fraktur_ocr_network
