version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: fraktur_ocr_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-fraktur_ocr_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraktur_ocr:latest
    container_name: fraktur_ocr_web
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_SERVE_STATIC_FILES=true
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-fraktur_ocr_production}
      - PDF_ROOT_DIR=/var/lib/fraktur/pdfs
      - RENDER_OUTPUT_DIR=/var/lib/fraktur/crops
    volumes:
      - ./storage:/rails/storage
      - ./public:/rails/public
      - ./log:/rails/log
      - pdfs:/var/lib/fraktur/pdfs
      - crops:/var/lib/fraktur/crops
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      worker:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraktur_ocr:latest
    container_name: fraktur_ocr_worker
    restart: unless-stopped
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-fraktur_ocr_production}
      - RENDER_OUTPUT_DIR=/var/lib/fraktur/crops
    volumes:
      - ./storage:/rails/storage
      - ./public:/rails/public
      - ./log:/rails/log
      - crops:/var/lib/fraktur/crops
    command: bin/rails solid_queue:start
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f solid_queue || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  render_listener:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraktur_ocr:latest
    container_name: fraktur_ocr_render_listener
    restart: unless-stopped
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-fraktur_ocr_production}
      - RENDER_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-fraktur_ocr_production}
    command: bin/render_listener
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  render:
    build:
      context: ./services/render
    image: fraktur_render:latest
    container_name: fraktur_ocr_render
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-fraktur_ocr_production}
      - PDF_ROOT_DIR=/var/lib/fraktur/pdfs
      - RENDER_OUTPUT_DIR=/var/lib/fraktur/crops
      - CACHE_DIR=/var/lib/fraktur/render-cache
    volumes:
      - pdfs:/var/lib/fraktur/pdfs
      - crops:/var/lib/fraktur/crops
      - render_cache:/var/lib/fraktur/render-cache
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
    driver: local
  pdfs:
    driver: local
  crops:
    driver: local
  render_cache:
    driver: local

networks:
  default:
    name: fraktur_ocr_network
