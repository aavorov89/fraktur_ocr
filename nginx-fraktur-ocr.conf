# Nginx configuration for Fraktur OCR
#
# Installation:
# 1. Copy this file to your server: /etc/nginx/sites-available/fraktur-ocr
# 2. Edit server_name and storage path below
# 3. Create symlink: sudo ln -s /etc/nginx/sites-available/fraktur-ocr /etc/nginx/sites-enabled/
# 4. Test: sudo nginx -t
# 5. Reload: sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;  # Change this to your domain or IP

    # CRITICAL: Increase max upload size for large PDFs
    client_max_body_size 200M;

    # Increase buffer sizes for large uploads
    client_body_buffer_size 128k;

    # Increase timeouts for large file uploads (10 minutes)
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    client_body_timeout 600s;

    # Disable buffering for large uploads to prevent disk writes
    proxy_request_buffering off;

    location / {
        # Forward to Docker container on port 3020
        proxy_pass http://localhost:3020;

        # Required headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for Turbo Streams)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # X-Accel-Redirect: nginx serves Active Storage files directly from disk.
    # Rails sends the header, nginx intercepts and serves the file — bypasses Ruby/Thruster entirely.
    # IMPORTANT: Change the alias path to match your storage directory on the host.
    location /rails/active_storage/disk/ {
        internal;
        alias /path/to/your/app/storage/;  # <-- CHANGE THIS to your actual storage path
    }

    # Active Storage uploads (direct upload endpoint)
    location /rails/active_storage {
        proxy_pass http://localhost:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 200M;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Health check endpoint
    location /up {
        proxy_pass http://localhost:3020;
        access_log off;
    }
}
